<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript DOM Practice</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1 id="mainHeading">My Website</h1>
        <p id="mainParagraph">Welcome to my website</p>
        <button id="changeTextBtn" type="button">Change Text</button>
      </section>

      <section class="card">
        <button id="showMessageBtn" type="button">Show Message</button>
        <p id="timeoutMessage"></p>
      </section>

      <section class="card">
        <h2>Counter: <span id="counterValue">0</span></h2>
        <div class="button-group">
          <button id="startCounterBtn" type="button">Start</button>
          <button id="stopCounterBtn" type="button">Stop</button>
        </div>
      </section>

      <section class="card">
        <p id="callbackOutput">Callback output will appear here.</p>
      </section>
    </main>

    <script src="script.js"></script>
    <footer class="site-footer" style="text-align:center;margin:28px 0;color:#475569">
      GitHub Repository: <a href="https://github.com/your-username/your-repo" target="_blank" rel="noopener">https://github.com/your-username/your-repo</a>
    </footer>
  </body>
</html>
